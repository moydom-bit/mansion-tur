<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Profesyonel Malikane Turu</title>
    <link rel="stylesheet" href="pannellum.css"/>
    <script type="text/javascript" src="pannellum.js"></script>
    <style>
        html, body, #panorama { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #000; }
    </style>
</head>
<body>

    <!-- Tur ekranının oynatılacağı alan -->
    <div id="panorama"></div>

    <!-- KRİTİK ALAN: Kodların düzgün çalışması için script etiketlerinin tam bu yapıda olması şarttır -->
    <script type="text/javascript">
    pannellum.viewer('panorama', {
        "type": "flat",
        "panorama": "manzara.jpeg?v=1",
        "autoLoad": true,
        "hfov": 60,
        "maxHfov": 100,
        "minHfov": 10,
        "crossOrigin": "anonymous"
    });
    </script>

</body>
</html>
