<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Profesyonel Malikane Turu</title>
    <link rel="stylesheet" href="pannellum.css"/>
    <script type="text/javascript" src="pannellum.js"></script>
    <style>
        html, body, #panorama { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #000; }
    </style>
</head>
<body>

    <div id="panorama"></div>

    <script type="text/javascript">
    pannellum.viewer('panorama', {
        "type": "flat",
        // KRİTİK DEĞİŞİKLİK: Resmi GitHub yerine tüm CORS izinleri açık olan harici ImgBB test sunucusundan besliyoruz
        "panorama": "manzara.jpg",
        "autoLoad": true,
        "crossOrigin": "anonymous", // Güvenlik kilitlerini esnetir
        "hfov": 90,
        "maxHfov": 120,
        "minHfov": 20
    });
    </script>

</body>
</html>
