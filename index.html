<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="utf-8">
    <title>Profesyonel Malikane Turu</title>
    <link rel="stylesheet" href="pannellum.css"/>
    <script type="text/javascript" src="pannellum.js"></script>
    <style>
        html, body, #panorama { width: 100%; height: 100%; margin: 0; padding: 0; background-color: #000; }
    </style>
</head>
<body>

    <div id="panorama"></div>

    <script type="text/javascript">
    pannellum.viewer('panorama', {
        "type": "flat",
        "panorama": "https://img.jamesedition.com/listing_images/2026/08/07/14/54/04/5ef40b2c-5491-40fb-a41f-feced0ada15d/je/2200xxs.jpg",
        "autoLoad": true,
        "crossOrigin": "anonymous",
        
        /* KRİTİK AYARLAR: Düz resim modunda motorun takılmasını engelleyen sınırlar */
        "hfov": 90,           // İlk açılış yakınlığı
        "maxHfov": 120,       // En fazla uzaklaşma sınırı
        "minHfov": 20,        // En fazla yakınlaşma (Zoom) sınırı
        "yawBound": 180,      // Sağa-sola maksimum kayma derecesi
        "pitchBound": 90      // Yukarı-aşağı maksimum kayma derecesi
    });
    </script>

</body>
</html>
